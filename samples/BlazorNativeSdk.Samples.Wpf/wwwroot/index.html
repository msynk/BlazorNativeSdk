<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorNativeSdk samples</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/BlazorNativeSdk.Samples.Shared/samples.css" />
    <style>
        #blazor-error-ui { display: none; position: fixed; inset: auto 0 0 0; padding: .75rem 1rem; background: #fff3cd; color: #5c4400; box-shadow: 0 -1px 4px rgba(0, 0, 0, .2); z-index: 1000; }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>
    <div id="app">Loading…</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">×</a>
    </div>

    <script src="_framework/blazor.webview.js"></script>
</body>

</html>
