<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlazorNativeSdk samples</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/BlazorNativeSdk.Samples.Shared/samples.css" />
    <link rel="icon" href="data:," />
    <style>
        #blazor-error-ui { display: none; position: fixed; inset: auto 0 0 0; z-index: 1000; padding: 12px 16px; background: #fff3bf; box-shadow: 0 -1px 4px rgb(0 0 0 / 20%); }
        #blazor-error-ui .dismiss { cursor: pointer; float: right; }
    </style>
</head>

<body>
    <div id="app">Loading…</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" role="button" aria-label="Dismiss">✕</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
